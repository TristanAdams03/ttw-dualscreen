; TTW DualScreen xNVSE plugin settings. Lives next to ttw_dualscreen.dll in Data\NVSE\Plugins.
[Server]
; Loopback only: anything that is not 127.x.x.x falls back to 127.0.0.1.
BindAddress=127.0.0.1
Port=7960

[Debug]
; off | info | debug. Log file: Data\NVSE\Plugins\ttw_dualscreen.log
LogLevel=info
