name: plugin

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B build -A Win32
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: ttw_dualscreen-dll
          path: |
            build/Release/ttw_dualscreen.dll
            plugin/ttw_dualscreen.ini
          if-no-files-found: ignore  # the DLL target arrives with the xNVSE entry point

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: cmake -S plugin -B b && cmake --build b && ctest --test-dir b --output-on-failure
